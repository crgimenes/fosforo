name: test

on: [push, pull_request, workflow_dispatch]

# The sibling repositories at the commits this revision was built with, so a
# run is reproducible; when one moves on, its ref moves here too, in the same
# commit (tools/manifest.sh prints them).

permissions:
  contents: read

jobs:
  # The C core (vt, glyph, pty, cfg) under ASan/UBSan, and the rocchetto
  # host on a pty. rocchetto, Filo, filo-term, Core War and edt are sibling
  # checkouts, as on a developer's disk.
  c:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: fosforo
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/rocchetto
          ref: fbc49afd567884caa8e37c0a26c72b452647ec72
          path: rocchetto
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/clang_filo
          ref: 772fd0a3074b8b81c8f851bd9f8fc5609459acb1
          path: clang_filo
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/filo-term
          ref: f16ae12648b7e24cefa1a27230f428afb4fdc1e2
          path: filo-term
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/corewar
          ref: 1ea35b51c0e91e6c47622d278812ad938e53de56
          path: corewar
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/edt
          ref: 375e891f70923ec64b2e1ff156b186d39eff5062
          path: edt
      - run: make -C fosforo all test

  # The Swift package: format, every warning an error, and the tests, SSH
  # and Mosh against a throwaway sshd and mosh-server on the loopback.
  swift:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: fosforo
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/rocchetto
          ref: fbc49afd567884caa8e37c0a26c72b452647ec72
          path: rocchetto
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/clang_filo
          ref: 772fd0a3074b8b81c8f851bd9f8fc5609459acb1
          path: clang_filo
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/filo-term
          ref: f16ae12648b7e24cefa1a27230f428afb4fdc1e2
          path: filo-term
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/corewar
          ref: 1ea35b51c0e91e6c47622d278812ad938e53de56
          path: corewar
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/edt
          ref: 375e891f70923ec64b2e1ff156b186d39eff5062
          path: edt
      - run: brew install mosh
      - run: make -C fosforo swift-fmt swift-build swift-test

  # Any byte stream is terminal output and none may fault: libFuzzer on
  # vt_write, with Homebrew's clang (Apple's ships no libFuzzer). Short by
  # design: a regression smoke, not the campaign.
  fuzz:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: fosforo
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/clang_filo
          ref: 772fd0a3074b8b81c8f851bd9f8fc5609459acb1
          path: clang_filo
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/filo-term
          ref: f16ae12648b7e24cefa1a27230f428afb4fdc1e2
          path: filo-term
      - run: brew install llvm
      - run: make -C fosforo fuzz LLVM="$(brew --prefix llvm)/bin" FUZZ_SECONDS=60
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            fosforo/crash-*
            fosforo/timeout-*
            fosforo/leak-*
          if-no-files-found: ignore

  # The C lint, with LLVM's own tools, on the headers it is written for: the
  # pty is a Mac's (openpty from util.h). The rocchetto host is linted with
  # rocchetto's flags, so its library is built first.
  lint:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: fosforo
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/rocchetto
          ref: fbc49afd567884caa8e37c0a26c72b452647ec72
          path: rocchetto
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/clang_filo
          ref: 772fd0a3074b8b81c8f851bd9f8fc5609459acb1
          path: clang_filo
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/filo-term
          ref: f16ae12648b7e24cefa1a27230f428afb4fdc1e2
          path: filo-term
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/corewar
          ref: 1ea35b51c0e91e6c47622d278812ad938e53de56
          path: corewar
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/edt
          ref: 375e891f70923ec64b2e1ff156b186d39eff5062
          path: edt
      - run: brew install llvm cppcheck
      - run: make -C fosforo fmt-check tidy check LLVM="$(brew --prefix llvm)/bin"

  # The iOS app: the UIKit code (#if os(iOS)) the Mac build never compiles,
  # for the simulator and, Release with every warning an error, for devices;
  # the simulator build runs once, headless (tools/ios-smoke.sh). Nothing is
  # signed for distribution.
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          path: fosforo
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/rocchetto
          ref: fbc49afd567884caa8e37c0a26c72b452647ec72
          path: rocchetto
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/clang_filo
          ref: 772fd0a3074b8b81c8f851bd9f8fc5609459acb1
          path: clang_filo
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/filo-term
          ref: f16ae12648b7e24cefa1a27230f428afb4fdc1e2
          path: filo-term
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/corewar
          ref: 1ea35b51c0e91e6c47622d278812ad938e53de56
          path: corewar
      - uses: actions/checkout@v7
        with:
          repository: crgimenes/edt
          ref: 375e891f70923ec64b2e1ff156b186d39eff5062
          path: edt
      - run: make -C fosforo ios-sim
      # the debug build launched in a throwaway simulator, no window:
      # typed into its shell, and Settings opened over it
      - run: fosforo/tools/ios-smoke.sh
      - run: >
          cd fosforo/swift && xcodebuild -scheme fosforo-ios -destination 'generic/platform=iOS'
          -configuration Release -derivedDataPath ../build/dd-ios-rel CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES -quiet build
